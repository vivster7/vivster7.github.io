<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whose Baby Is It Anyways? - Baby Shower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #fdf8f4;
      color: #5a4a42;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 2.5rem 1.25rem 3rem;
      text-align: center;
      flex: 1;
    }

    .back {
      display: inline-block;
      font-size: 0.9rem;
      color: #b89b8a;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }

    .back:hover { color: #8b6f5e; }

    .icon-area {
      margin-bottom: 1.2rem;
    }

    .icon-area svg {
      width: min(100px, 25vw);
      height: auto;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: #8b6f5e;
      margin-bottom: 0.5rem;
    }

    .coming-soon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #b89b8a;
      margin-bottom: 1.5rem;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #a08478;
      max-width: 380px;
      margin: 0 auto;
    }

    .bottom-accent {
      padding: 2rem 0 1.5rem;
      text-align: center;
    }

    .bottom-accent svg {
      width: min(120px, 30vw);
      height: auto;
      opacity: 0.35;
    }
  </style>
</head>

<body>

  <div class="container">
    <a class="back" href="index.html">&larr; Back to games</a>

    <div class="icon-area" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- polaroid-style frame -->
        <rect x="18" y="12" width="64" height="72" rx="3" fill="#fff" stroke="#d4bfad" stroke-width="1.2"/>
        <rect x="24" y="18" width="52" height="46" rx="1" fill="#f0e4d8"/>
        <!-- baby face in the photo -->
        <circle cx="50" cy="38" r="14" fill="#e8d5c4"/>
        <circle cx="45" cy="36" r="1.8" fill="#b89b8a"/>
        <circle cx="55" cy="36" r="1.8" fill="#b89b8a"/>
        <path d="M46 43 Q50 47 54 43" stroke="#b89b8a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M40 26 Q50 18 60 26" stroke="#d4bfad" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- question mark overlay -->
        <circle cx="68" cy="18" r="10" fill="#f2c6b8" opacity="0.8"/>
        <text x="68" y="23" font-family="Cormorant Garamond, serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">?</text>
      </svg>
    </div>

    <h1>Whose Baby Is It Anyways?</h1>
    <p class="coming-soon">Coming soon</p>
    <p class="description">
      Can you match the adorable baby photo to the right guest?
      Prepare for some surprising reveals and plenty of laughs.
    </p>
  </div>

  <div class="bottom-accent" aria-hidden="true">
    <svg viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- two small bunnies -->
      <ellipse cx="38" cy="34" rx="10" ry="7" fill="#d4bfad"/>
      <circle cx="46" cy="26" r="5.5" fill="#d4bfad"/>
      <ellipse cx="43" cy="18" rx="2" ry="6" fill="#d4bfad" transform="rotate(-8 43 18)"/>
      <ellipse cx="49" cy="17" rx="2" ry="6.5" fill="#d4bfad" transform="rotate(8 49 17)"/>
      <circle cx="28" cy="32" r="2.5" fill="#e0cfc2"/>

      <ellipse cx="78" cy="34" rx="10" ry="7" fill="#d4bfad"/>
      <circle cx="70" cy="26" r="5.5" fill="#d4bfad"/>
      <ellipse cx="67" cy="17" rx="2" ry="6.5" fill="#d4bfad" transform="rotate(-8 67 17)"/>
      <ellipse cx="73" cy="18" rx="2" ry="6" fill="#d4bfad" transform="rotate(8 73 18)"/>
      <circle cx="88" cy="32" r="2.5" fill="#e0cfc2"/>

      <!-- small heart between them -->
      <path d="M58 28 Q55 22 58 26 Q61 22 58 28Z" fill="#e8c4b8" opacity="0.6"/>
    </svg>
  </div>

</body>

</html>
