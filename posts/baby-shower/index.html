<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Shower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #fdf8f4;
      color: #5a4a42;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* --- decorative top arc --- */
    .top-accent {
      width: 100%;
      text-align: center;
      padding: 2.5rem 1rem 0;
    }

    .top-accent svg {
      width: min(220px, 50vw);
      height: auto;
    }

    /* --- main content --- */
    .container {
      width: 100%;
      max-width: 520px;
      padding: 0 1.25rem 3rem;
      text-align: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      color: #8b6f5e;
      margin: 0.6rem 0 0.2rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #b89b8a;
      margin-bottom: 2.2rem;
    }

    /* --- game cards --- */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #fff;
      border: 1px solid #ecddd3;
      border-radius: 1rem;
      padding: 1.25rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(139, 111, 94, 0.12);
      outline: none;
    }

    .card:active {
      transform: translateY(0);
    }

    .card-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
    }

    .card-body {
      text-align: left;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.2rem;
      color: #8b6f5e;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #a08478;
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    /* --- bottom decorative flourish --- */
    .bottom-accent {
      margin-top: auto;
      padding: 2rem 0 1.5rem;
      text-align: center;
    }

    .bottom-accent svg {
      width: min(140px, 35vw);
      height: auto;
      opacity: 0.45;
    }

    /* --- responsive tweaks --- */
    @media (min-width: 480px) {
      .card {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- decorative header: sleeping bunny on a crescent moon -->
  <div class="top-accent" aria-hidden="true">
    <svg viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- crescent moon -->
      <path d="M100 130 C45 130, 10 95, 10 60 C10 25, 45 0, 85 0 C60 15, 50 45, 55 70 C60 100, 80 125, 100 130Z" fill="#f5e6d3"/>
      <!-- small stars -->
      <circle cx="140" cy="22" r="2.5" fill="#dcc4ab"/>
      <circle cx="160" cy="45" r="1.8" fill="#dcc4ab"/>
      <circle cx="125" cy="10" r="1.5" fill="#dcc4ab"/>
      <circle cx="175" cy="30" r="2" fill="#dcc4ab"/>
      <!-- bunny body on the moon -->
      <ellipse cx="72" cy="98" rx="16" ry="12" fill="#e8d5c4"/>
      <!-- bunny head -->
      <circle cx="86" cy="88" r="10" fill="#e8d5c4"/>
      <!-- bunny ears -->
      <ellipse cx="80" cy="68" rx="4" ry="13" fill="#e8d5c4" transform="rotate(-10 80 68)"/>
      <ellipse cx="80" cy="70" rx="2" ry="9" fill="#f2c6b8" transform="rotate(-10 80 70)"/>
      <ellipse cx="92" cy="66" rx="4" ry="14" fill="#e8d5c4" transform="rotate(8 92 66)"/>
      <ellipse cx="92" cy="68" rx="2" ry="10" fill="#f2c6b8" transform="rotate(8 92 68)"/>
      <!-- closed eyes (sleeping) -->
      <path d="M82 87 Q84 89 86 87" stroke="#b89b8a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M88 86 Q90 88 92 86" stroke="#b89b8a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- tiny nose -->
      <circle cx="87" cy="90" r="1" fill="#d4a898"/>
      <!-- bunny tail -->
      <circle cx="56" cy="95" r="4" fill="#f0e0d2"/>
      <!-- small z's for sleeping -->
      <text x="100" y="78" font-family="Cormorant Garamond, serif" font-size="10" fill="#c4a994" font-style="italic" opacity="0.7">z</text>
      <text x="110" y="68" font-family="Cormorant Garamond, serif" font-size="8" fill="#c4a994" font-style="italic" opacity="0.5">z</text>
      <text x="117" y="60" font-family="Cormorant Garamond, serif" font-size="6" fill="#c4a994" font-style="italic" opacity="0.3">z</text>
    </svg>
  </div>

  <div class="container">
    <h1>Welcome!</h1>
    <p class="subtitle">Let the games begin</p>

    <div class="cards">

      <!-- 1 - Prediction Market -->
      <a class="card" href="prediction-market.html">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- crystal ball -->
            <circle cx="26" cy="24" r="16" fill="#f0e4d8" stroke="#d4bfad" stroke-width="1.2"/>
            <ellipse cx="26" cy="42" rx="12" ry="3" fill="#d4bfad"/>
            <!-- sparkles inside -->
            <circle cx="20" cy="20" r="1.5" fill="#c9a68e"/>
            <circle cx="30" cy="18" r="1" fill="#c9a68e"/>
            <circle cx="26" cy="28" r="1.2" fill="#c9a68e"/>
            <!-- tiny star -->
            <path d="M32 24 L33 22 L34 24 L33 26Z" fill="#c9a68e"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-title">Prediction Market</div>
          <div class="card-desc">Place your best baby predictions</div>
        </div>
      </a>

      <!-- 2 - Quiz -->
      <a class="card" href="quiz.html">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- book -->
            <rect x="10" y="10" width="32" height="32" rx="3" fill="#f0e4d8" stroke="#d4bfad" stroke-width="1.2"/>
            <line x1="26" y1="10" x2="26" y2="42" stroke="#d4bfad" stroke-width="1"/>
            <!-- question mark -->
            <text x="26" y="32" font-family="Cormorant Garamond, serif" font-size="16" fill="#b89b8a" text-anchor="middle" font-weight="600">?</text>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-title">Baby Shower Quiz</div>
          <div class="card-desc">How well do you know the parents-to-be?</div>
        </div>
      </a>

      <!-- 3 - Whose Baby Is It Anyways -->
      <a class="card" href="whose-baby-is-it-anyways.html">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- baby face outline -->
            <circle cx="26" cy="26" r="16" fill="#f0e4d8" stroke="#d4bfad" stroke-width="1.2"/>
            <!-- eyes -->
            <circle cx="21" cy="24" r="1.8" fill="#b89b8a"/>
            <circle cx="31" cy="24" r="1.8" fill="#b89b8a"/>
            <!-- smile -->
            <path d="M22 30 Q26 34 30 30" stroke="#b89b8a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            <!-- little tuft of hair -->
            <path d="M20 12 Q26 6 32 12" stroke="#d4bfad" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-title">Whose Baby Is It Anyways?</div>
          <div class="card-desc">Match the baby photo to the guest</div>
        </div>
      </a>

    </div>
  </div>

  <!-- bottom flourish: small deer silhouette -->
  <div class="bottom-accent" aria-hidden="true">
    <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- deer body -->
      <ellipse cx="60" cy="55" rx="22" ry="14" fill="#d4bfad"/>
      <!-- deer head -->
      <circle cx="82" cy="42" r="8" fill="#d4bfad"/>
      <!-- ear -->
      <ellipse cx="86" cy="34" rx="3" ry="5" fill="#d4bfad" transform="rotate(15 86 34)"/>
      <!-- antler (small, fawn-like) -->
      <path d="M80 34 L78 24 M78 28 L74 24" stroke="#c4a994" stroke-width="1.5" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="85" cy="41" r="1.2" fill="#8b6f5e"/>
      <!-- legs -->
      <line x1="48" y1="66" x2="46" y2="78" stroke="#d4bfad" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="55" y1="67" x2="54" y2="78" stroke="#d4bfad" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="65" y1="67" x2="66" y2="78" stroke="#d4bfad" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="72" y1="66" x2="74" y2="78" stroke="#d4bfad" stroke-width="2.5" stroke-linecap="round"/>
      <!-- tail -->
      <ellipse cx="38" cy="50" rx="4" ry="3" fill="#e8d5c4"/>
      <!-- spots -->
      <circle cx="52" cy="50" r="2" fill="#e8d5c4"/>
      <circle cx="62" cy="48" r="1.5" fill="#e8d5c4"/>
      <circle cx="56" cy="56" r="1.8" fill="#e8d5c4"/>
      <!-- ground line -->
      <line x1="20" y1="78" x2="100" y2="78" stroke="#e0cfc2" stroke-width="0.8"/>
    </svg>
  </div>

</body>

</html>
